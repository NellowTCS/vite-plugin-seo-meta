# Simple workflow for deploying static content to GitHub Pages
name: Deploy browser build to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: npm ci && npm run build

      - name: Build docs
        working-directory: Docs
        run: npm ci && npm run build

      - name: Install demo dependencies
        working-directory: Demo
        run: npm i

      - name: Build demo
        working-directory: Demo
        run: npx vite build --base /vite-plugin-seo-meta/demo/

      # Docs at root and demo at /demo
      - name: Assemble site
        run: |
          rm -rf gh-pages-root
          mkdir -p gh-pages-root/demo
          cp -R Docs/site/. gh-pages-root/
          cp -R Demo/dist/. gh-pages-root/demo/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-root